name: Build, Test & Coverage

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    # O Docker já vem instalado no ubuntu-latest,
    # mas garantimos que o serviço está ativo para o Testcontainers
    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
      # ─────────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # 2. Setup .NET 10
      # ─────────────────────────────────────────
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # ─────────────────────────────────────────
      # 3. Cache NuGet packages
      # ─────────────────────────────────────────
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ─────────────────────────────────────────
      # 4. Restore dependências
      # ─────────────────────────────────────────
      - name: Restore dependencies
        run: dotnet restore

      # ─────────────────────────────────────────
      # 5. Build (Release para garantir otimizações)
      # ─────────────────────────────────────────
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # ─────────────────────────────────────────
      # 6. Testes com coleta de code coverage
      #    --collect:"XPlat Code Coverage" usa o
      #    coverlet integrado ao xUnit no .NET
      # ─────────────────────────────────────────
      - name: Run tests with coverage
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=detailed" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
        env:
          # Variável necessária para o Testcontainers localizar o socket do Docker
          DOCKER_HOST: unix:///var/run/docker.sock
          # Desabilita o Ryuk (reaper) — recomendado em CI para evitar problemas de permissão
          TESTCONTAINERS_RYUK_DISABLED: "true"

      # ─────────────────────────────────────────
      # 7. Publica resultados dos testes (TRX)
      #    Aparece na aba "Tests" do PR/commit
      # ─────────────────────────────────────────
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always() # roda mesmo se os testes falharem
        with:
          name: xUnit Test Results
          path: "TestResults/**/*.trx"
          reporter: dotnet-trx
          fail-on-error: true

      # ─────────────────────────────────────────
      # 8. Gera relatório HTML de coverage com
      #    ReportGenerator (ferramenta oficial .NET)
      # ─────────────────────────────────────────
      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/CoverageReport" \
            -reporttypes:"Html;Cobertura;Badges" \
            -verbosity:Info

      # ─────────────────────────────────────────
      # 9. Faz upload do relatório como artefato
      #    Download disponível por 30 dias na UI
      # ─────────────────────────────────────────
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: TestResults/CoverageReport/
          retention-days: 30

      # ─────────────────────────────────────────
      # 10. Publica resumo de coverage no PR
      #     (comentário com % de cobertura)
      # ─────────────────────────────────────────
      - name: Code coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "TestResults/**/coverage.cobertura.xml"
          badge: true
          fail_below_min: false        # mude para true para bloquear PRs abaixo do mínimo
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both                 # gera arquivo E adiciona ao $GITHUB_STEP_SUMMARY
          thresholds: "60 80"          # amarelo < 60%, verde entre 60-80%, azul > 80%

      - name: Add coverage PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
